[build]
builder = "NIXPACKS"
buildCommand = "npm install && NODE_ENV=production npx turbo run build --filter=@cryptovix/web"

[deploy]
startCommand = "NODE_ENV=production npx next start -p $PORT --hostname 0.0.0.0"
workingDirectory = "apps/web"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
