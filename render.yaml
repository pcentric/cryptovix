services:
  - type: web
    name: cryptovix-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npx turbo run build --filter=@cryptovix/api...
    startCommand: NODE_ENV=production node apps/api/dist/index.js
    envVars:
      - key: DATABASE_URL
        value: file:./cryptovix.db
      - key: API_PORT
        value: 3001
      - key: API_HOST
        value: 0.0.0.0

  - type: web
    name: cryptovix-web
    runtime: node
    rootDir: .
    buildCommand: NODE_ENV=development npm install && npx turbo run build --filter=@cryptovix/web...
    startCommand: cd apps/web && npx next start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: API_BASE_URL
        value: https://cryptovix.onrender.com

  - type: web
    name: cryptovix-pinger
    runtime: node
    rootDir: apps/pinger
    buildCommand: echo "no build needed"
    startCommand: node index.js
    envVars:
      - key: PING_URL
        value: https://cryptovix.onrender.com/health
      - key: PING_INTERVAL_MS
        value: "840000"
