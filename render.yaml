services:
  - type: web
    name: cryptovix-api
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev && npx turbo run build --filter=@cryptovix/api...
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: DATABASE_URL
        value: file:./cryptovix.db
      - key: API_PORT
        value: 3001
      - key: API_HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
